[project]
name = "midst-community-detection"
version = "0.1.0"
description = "Benchmark di community detection centralizzata (NetworkX) vs distribuita (PySpark/GraphFrames) su grafi SNAP"
requires-python = "==3.12.*"

# solo il percorso locale (NetworkX): pyspark sta in requirements.txt, per Docker
dependencies = [
    "networkx==3.5",
    "pandas==2.3.3",
    "scikit-learn==1.7.2",
    "matplotlib==3.10.6",
    "psutil==7.1.0",  # backend di memory-profiler
    "numpy",
    "pyarrow",
    "memory-profiler>=0.61.0",
]

[tool.uv]
# `src/` viene eseguito come modulo (`python -m src.benchmark.run_local`)
package = false

# solo per i controlli dell'editor
[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "off"
